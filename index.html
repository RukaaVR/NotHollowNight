<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Veilfall — an original hand-drawn style action metroidvania." />
    <title>Veilfall</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; image-rendering: auto; outline: none; touch-action: none; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a8fa8; font: 14px Georgia, serif; letter-spacing: 0.3em; pointer-events: none; }
      #boot.err { color: #e08a7a; letter-spacing: normal; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Veilfall game canvas"></canvas>
    <div id="boot">VEILFALL</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
